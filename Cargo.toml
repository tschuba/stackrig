[package]
name = "stackrig"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "strig"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
strip = true
