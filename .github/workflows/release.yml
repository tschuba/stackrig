name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-unknown-linux-musl
      - run: cargo test
      - run: cargo build --release --target aarch64-unknown-linux-musl
      - run: cp target/aarch64-unknown-linux-musl/release/strig strig-linux-arm64
      - uses: actions/upload-artifact@v4
        with: { name: strig-linux-arm64, path: strig-linux-arm64 }
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" strig-linux-arm64 --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
